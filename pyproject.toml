[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-context-brazil"
version = "0.1.0"
description = "Exploratory research on Brazil's relationship with DeFi through stablecoin activity on Ethereum."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.2,<3.1",
    "requests>=2.31",
    "ccxt>=4.3",
    "duckdb>=1.0",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["src.ingestion", "src.transformation", "src.analysis"]

[tool.setuptools.package-data]
"src.ingestion" = ["*.py"]
"src.transformation" = ["*.py"]
"src.analysis" = ["*.py"]